<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mrwvisa · 论文解读</title>
<meta name="description" content="按领域与年份浏览的论文解读库：模块级架构图、真实 shape、代码核对的超参。">
<style>
/* ===== GitHub (Primer) 主题 —— 与 paper-explainer 产物同一套基因 ===== */
:root{
  --ink:#1f2328; --ink2:#59636e; --ink3:#818b98;
  --bg:#f6f8fa; --card:#ffffff; --line:#d1d9e0;
  --c-enc:#0969da;  --c-enc-bg:#ddf4ff;  --c-enc-line:#a5d8ff;
  --star:#e3b341; --star-bg:#fff8c5; --star-line:#eac54f;
  --read:#1a7f37; --read-bg:#dafbe1;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
.layout{display:flex;max-width:none;margin:0;gap:clamp(8px,.8vw,16px);padding:0 clamp(12px,1.6vw,24px) 0 clamp(16px,4vw,96px)}

/* ============ 左侧领域菜单（GitHub 侧栏风；宽度按屏宽比例，1512px 基准≈128px） ============ */
.toc{width:clamp(96px,8.5vw,160px);flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;padding:20px 2px 40px 0;border-right:1px solid var(--line)}
.toc a{display:block;color:var(--ink2);text-decoration:none;font-size:13.5px;padding:5px 6px;border-radius:6px;border-left:2px solid transparent;transition:background .12s;cursor:pointer}
.toc a:hover{background:var(--bg);color:var(--ink)}
.toc a.active{color:var(--c-enc);border-left-color:var(--c-enc);background:var(--c-enc-bg);font-weight:600}

/* ============ 内容区 ============ */
.content{flex:1;min-width:0;padding-bottom:120px}

/* 年份分组 */
.year{margin-top:26px}
.year:first-child{margin-top:24px}
.year-title{font-size:15px;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.year-count{font-size:12px;font-weight:400;color:var(--ink3)}

/* ============ 卡片（workbench 布局词汇 + Primer 配色） ============ */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(280px,24vw,520px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--c-enc);box-shadow:0 1px 4px rgba(9,105,218,.15)}
.card-head{display:flex;align-items:center;gap:8px;padding-right:26px}
.p-name{font-weight:600;color:var(--c-enc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-venue{margin-left:auto;color:var(--ink3);font-size:12px;font-family:var(--mono);white-space:nowrap}
/* 全称固定 2 行占位，保证跨卡片关键线对齐（workbench 做法） */
.p-full{color:var(--ink3);font-size:12.5px;margin:6px 0 2px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-desc{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 星标：右下角裸 ★（点击变黄，localStorage 持久化） */
.star{position:absolute;bottom:10px;right:12px;padding:0;line-height:1;font-size:16px;border:none;background:none;color:var(--ink3);opacity:.55;cursor:pointer}
.star:hover{opacity:1}
.star.on{opacity:1;color:var(--star)}

/* 已读标记（写完即标，2026-10-11 规则）：解读写完后由源码标（只读展示，不可点击）；已读 = 绿实心 ✓ */
.rdbtn{position:absolute;top:9px;right:10px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1;border:1.5px solid var(--line);border-radius:50%;background:none;color:var(--ink3);opacity:.55;padding:0}
.rdbtn.on{opacity:1;background:var(--read);border-color:var(--read);color:#fff}

footer{position:fixed;bottom:0;left:0;width:100%;text-align:center;font-size:12.5px;color:var(--ink3);font-family:var(--mono);background:var(--bg);border-top:1px solid var(--line);padding:6px 0}

/* ============ 前馈式路线图（卡片顶部总览，2026-10 新增） ============ */
.rmap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px 8px;margin-top:14px}
.rmap h2{font-size:13.5px;font-weight:600}
.rmap .rsub{font-size:11px;color:var(--ink3);margin:1px 0 6px}
.rmap .rsub .st{color:var(--star)}
.rt{--c:var(--c-enc)}
.rt2{--c:#8250df}
.rt3{--c:#1a7f37}
.rt .rh{display:flex;align-items:baseline;gap:8px}
.rt .rh b{font-size:12px;font-weight:600;color:var(--c);padding-left:8px;border-left:3px solid var(--c)}
.rt .rh span{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.mtlw{overflow-x:auto}
.mtl{position:relative;height:134px;min-width:780px;margin:0 6px}
.maxis{position:absolute;left:0;right:10px;top:50%;height:2px;background:var(--c);opacity:.7}
.maxis::after{content:"";position:absolute;right:-9px;top:-4px;border-left:9px solid var(--c);
  border-top:5px solid transparent;border-bottom:5px solid transparent}
.mglab{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.mnode{position:absolute;top:50%;width:0}
.mdot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--c);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--c)}
.mnode.ms .mdot{width:11px;height:11px;left:-5.5px;top:-5.5px}
.mstem{position:absolute;left:-1px;width:2px;background:var(--c);opacity:.5}
.mnode.up .mstem{bottom:3px;height:13px}
.mnode.dn .mstem{top:3px;height:13px}
.mlab{position:absolute;left:0;transform:translateX(-50%);width:92px;text-align:center}
.mnode.up .mlab{bottom:19px}
.mnode.dn .mlab{top:19px}
.mlab b{display:block;font-size:11px;font-weight:600;color:var(--c);white-space:nowrap}
.mlab b .st{color:var(--star)}
.mlab i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--ink3);white-space:nowrap}
.mlab u{display:block;text-decoration:none;font-size:8.5px;color:#8250df}
/* 已读节点（写完即标）：圆点放大成带白勾的实心圆 + 绿光晕（只读展示，由源码标记） */
.mnode.read .mdot{background:var(--read);width:15px;height:15px;left:-7.5px;top:-7.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(26,127,55,.28);z-index:2}
.mnode.read .mdot::after{content:"✓";color:#fff;font-size:10px;font-weight:700;line-height:1;margin-top:-1px}

/* 窄屏：侧栏折叠为顶部横向条 */
@media(max-width:900px){
  .layout{flex-direction:column;gap:0}
  .toc{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:12px 0 10px;border-right:none;border-bottom:1px solid var(--line);margin-bottom:6px}
  .toc h3{display:none}
  .toc a{border-left:none;border:1px solid var(--line);border-radius:6px;white-space:nowrap;flex-shrink:0}
  .toc a.active{border-color:var(--c-enc-line)}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>

    year: 2024,

  {

  {
    domain: "4D重建", route: "占用世界模型",

    year: 2025,
    file: "4d-reconstruct/2025-drive-occworld.html",
    desc: "把视觉中心的 4D 占用预测世界模型适配成端到端规划器，用占用代价函数在预演的未来里选轨迹",
  },
  {
    domain: "4D重建", route: "占用世界模型",
    title: "DIO",
    full: "DIO: Decomposable Implicit Occupancy-Flow World Model for Autonomous Driving",
    venue: "arXiv 2024",
    year: 2024,
    file: "4d-reconstruct/2024-dio.html",
    desc: "从稀疏 LiDAR 学隐式占用-流场并按实例分解的自监督世界模型，可补全当前场景、外推未来、迁移到点云预测",
  },
  // ── 路线三：Gaussian 世界模型（参数化基元当场景状态）──
  {
    domain: "4D重建", route: "Gaussian 世界模型",
    title: "GaussianWorld",
    full: "Gaussian World Model for Streaming 3D Occupancy Prediction",
    venue: "CVPR 2025",
    year: 2025,
    file: "4d-reconstruct/2025-gaussianworld.html",
    desc: "把 3D 占用预测重构为以当前观测为条件的 4D 占用预测，用 Gaussian 世界模型按静态对齐/动态运动/新场景补全三个因子演化场景流",
    star: true,
  },
  // ── 新领域：自监督预训练（掩码建模路线，MAE 是本站渲染式预训练一脉的源头）──
  {
    domain: "自监督预训练", route: "掩码建模预训练",
    title: "MAE",
    full: "Masked Autoencoders Are Scalable Vision Learners",
    venue: "CVPR 2022",
    year: 2022,
    file: "self-supervised/2022-mae.html",
    desc: "非对称掩码自编码器——编码器只看 25% 可见 patch，轻量解码器在补全 mask token 的完整序列上重建像素，75% 高掩码率既逼出整体语义理解又把预训练算力省到四分之一",
    star: true,
  },
  // 新条目：domain 填领域（左侧菜单），route 填上面路线或新路线名（右侧分组）；star: true 默认星标
];

/* ---------- 以下为渲染代码，无需改动 ---------- */
let currentDomain = PAPERS[0]?.domain ?? "全部";
// 星标：数据里 star:true 为默认；用户点击后存覆盖值（key starOv，{file: bool}）
const starOv = JSON.parse(localStorage.getItem("starOv") || "{}");
const isStarred = p => starOv[p.file] !== undefined ? starOv[p.file] : !!p.star;
// 已读标记（2026-10-11 用户定，写完即标）：一篇解读写完后 Claude 即在源码打双勾——PAPERS 加 read: true（卡片右上角绿 ✓）
// + 路线图对应节点加 read 类（带勾绿点），两处同时标；页面只读展示，不提供任何前端切换

function renderToc() {
  const domains = [...new Set(PAPERS.map(p => p.domain))];
  document.getElementById("toc").innerHTML = domains.map(d =>
    `<a class="${d === currentDomain ? "active" : ""}" onclick="selectDomain('${d}')">${d}</a>`).join("");
}

function selectDomain(d) {
  currentDomain = d;
  renderToc();
  renderGroups();
}

function renderGroups() {
  const list = PAPERS.filter(p => currentDomain === "全部" || p.domain === currentDomain);
  const routes = [...new Set(list.map(p => p.route))];
  // 本领域专属路线图（没有配图的领域不显示）
  const rmapTpl = document.querySelector(`template.rmap-tpl[data-domain="${currentDomain}"]`);
  const rmap = rmapTpl ? rmapTpl.innerHTML : "";
  const cards = routes.map(rt => {
    const ps = list.filter(p => p.route === rt).sort((a, b) => a.year - b.year);  // 严格按时间线升序：早年在前，同年保持数组顺序
    return `
      <section class="year">
        <h2 class="year-title">${rt}<span class="year-count">${ps.length} 篇</span></h2>
        <div class="card-grid">${ps.map(cardHTML).join("")}</div>
      </section>`;
  }).join("");
  document.getElementById("groups").innerHTML =
    rmap + (cards || `<p style="color:var(--ink3);margin-top:30px">该领域还没有解读。</p>`);
}

function cardHTML(p) {
  const on = isStarred(p) ? "on" : "";
  return `
    <div class="card" onclick="location.href='${p.file}'">
      <button class="star ${on}" title="星标"
              onclick="toggleStar(event, '${p.file}')">★</button>
      ${p.read ? '<span class="rdbtn on" title="已读">✓</span>' : ""}
      <div class="card-head">
        <span class="p-name" title="${p.full}">${p.title}</span>
        <span class="p-venue">${p.venue}</span>
      </div>
      <div class="p-full">${p.full}</div>
      <div class="p-desc">${p.desc || ""}</div>
    </div>`;
}

function toggleStar(e, file) {
  e.stopPropagation();
  const p = PAPERS.find(x => x.file === file);
  const now = !isStarred(p);
  starOv[file] = now;
  localStorage.setItem("starOv", JSON.stringify(starOv));
  e.currentTarget.classList.toggle("on", now);
}

// （前端已读切换已移除：只读标记由源码写入，2026-10-11 用户定）

renderToc();
renderGroups();
</script>
